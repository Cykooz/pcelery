[buildout]
develop = src
extends = versions.cfg
versions = versions
show-picked-versions = true
allow-picked-versions = true
parts =
    pcelery
    ipython
    twine
    idea


[pcelery]
recipe = zc.recipe.egg:scripts
eggs =
    pcelery[test]


[ipython]
recipe = zc.recipe.egg:scripts
eggs =
    ${pcelery:eggs}
    ipython
scripts = ipython


[twine]
recipe = zc.recipe.egg:scripts
eggs =
    build
    twine
scripts =
    twine
interpreter = python_twine


[idea]
recipe = cykooz.recipe.idea
eggs =
    ${pcelery:eggs}
